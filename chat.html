<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">         
    <title>인물 챗봇 - Gemini Chat</title>
    <script>
        (function () {
            var b = location.protocol === 'file:' ? 'public/' : '/';
            document.write('<script src="' + b + 'js/theme.js"><\/script>' +
                '<link rel="stylesheet" href="' + b + 'css/theme.css">');
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

        body { 
            background: var(--bg-dark-brown); 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
            color: var(--text-primary);
        }

        /* 상단 헤더 */
        header {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 10px 24px; 
            background: var(--bg-beige); 
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .nav-back-btn {
            background: transparent;
            border: 1px solid var(--border-strong);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .nav-back-btn:hover {
            background: var(--surface-2);
        }

        .chat-mode-badge {
            background: rgba(255, 90, 121, 0.15);
            color: #FF5A79;
            border: 1px solid rgba(255, 90, 121, 0.35);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .model-select {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.88rem;
        }

        .reset-btn {
            background: var(--surface-2);
            color: var(--text-primary);
            border: 1px solid var(--border-strong);
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .reset-btn:hover {
            background: var(--brand-soft);
            color: var(--brand);
        }

        /* 2분할 메인 레이아웃 */
        #main-container {
            display: flex;
            flex: 1;
            padding: 16px 20px;
            gap: 16px;
            height: calc(100vh - 58px);
            box-sizing: border-box;
            overflow: hidden;
        }

        /* 좌측: 캐릭터 프로필 사이드바 */
        .char-sidebar {
            width: 340px;
            background: var(--bg-beige);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .profile-avatar-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .profile-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid var(--brand);
            overflow: hidden;
            background-color: var(--surface);
            box-shadow: 0 6px 18px rgba(0,0,0,0.18);
            cursor: pointer;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .profile-avatar:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 24px rgba(255, 68, 50, 0.25);
        }
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .profile-avatar:hover .profile-avatar-overlay {
            display: flex;
        }

        .char-name {
            margin-top: 12px;
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-black);
            text-align: center;
            word-break: keep-all;
        }

        .char-status {
            font-size: 0.8rem;
            color: #00B58B;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 4px;
            font-weight: 600;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00B58B;
            display: inline-block;
        }

        .char-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }
        .action-chip {
            font-size: 0.78rem;
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .action-chip:hover {
            color: var(--brand);
            border-color: var(--brand);
        }

        .profile-card-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.88rem;
        }
        .info-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }
        .info-box-title {
            font-size: 0.82rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 6px;
        }
        .info-box-content {
            font-size: 0.88rem;
            line-height: 1.5;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: keep-all;
        }

        /* 우측: 1:1 채팅창 */
        .chat-container {
            flex: 1;
            background: var(--bg-beige);
            border: 1px solid var(--border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-black);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-beige);
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--surface);
        }

        /* 메시지 버블 */
        .msg-row {
            display: flex;
            gap: 10px;
            max-width: 80%;
        }
        .msg-row.bot {
            align-self: flex-start;
        }
        .msg-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid var(--border);
        }
        .msg-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .msg-content-wrap {
            display: flex;
            flex-direction: column;
        }
        .msg-sender {
            font-size: 0.78rem;
            font-weight: bold;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .msg-row.user .msg-sender {
            text-align: right;
        }

        .msg-bubble {
            padding: 12px 18px;
            border-radius: 14px;
            line-height: 1.6;
            word-break: break-word;
            font-size: 0.96rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .msg-row.bot .msg-bubble {
            background: var(--surface-2);
            color: var(--text-primary);
            border-top-left-radius: 2px;
        }
        .msg-row.user .msg-bubble {
            background: var(--brand);
            color: #FFFFFF;
            border-top-right-radius: 2px;
        }

        .msg-bubble img {
            max-width: 320px;
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 8px 0;
            display: block;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .msg-bubble img:hover {
            transform: scale(1.02);
        }

        /* 하단 입력창 */
        .chat-input-bar {
            padding: 14px 18px;
            display: flex;
            gap: 10px;
            background: var(--bg-beige);
            border-top: 1px solid var(--border);
            align-items: center;
        }
        .chat-input-bar input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }
        .chat-input-bar input:focus {
            border-color: var(--brand);
        }

        .btn-send {
            padding: 13px 22px;
            background: var(--brand);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.98rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-send:hover { opacity: 0.92; transform: translateY(-1px); }

        .btn-scene {
            padding: 13px 18px;
            background: var(--surface-2);
            color: var(--text-primary);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-scene:hover {
            background: var(--surface);
            border-color: var(--brand);
            color: var(--brand);
        }

        /* 로딩 애니메이션 */
        .loading-bubble {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            background: var(--surface-2);
            border-radius: 14px;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }
        .dot {
            width: 6px;
            height: 6px;
            background: var(--brand);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @media (max-width: 860px) {
            #main-container {
                flex-direction: column;
                padding: 10px;
                height: calc(100vh - 56px);
            }
            .char-sidebar {
                width: 100%;
                max-height: 180px;
                padding: 12px;
            }
            .profile-avatar {
                width: 70px;
                height: 70px;
            }
            .chat-container {
                flex: 1;
                min-height: 400px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="nav-back-btn" onclick="location.href='/'" title="대시보드로 이동">
                <i class="bi bi-arrow-left"></i> 홈
            </button>
            <span class="chat-mode-badge"><i class="bi bi-chat-heart-fill"></i> 인물 챗봇 (Zeta)</span>
        </div>
        <div class="header-right">
            <select id="model-select" class="model-select">
                <option value="gpt-5.4-mini">gpt-5.4-mini</option>
                <option value="gpt-5.4-nano">gpt-5.4-nano</option>
                <option value="gpt-5.4">GPT-5.4</option>
            </select>
            <button class="reset-btn" onclick="location.href='/gallery'" title="생성된 일러스트 보관함">
                <i class="bi bi-images"></i> 갤러리
            </button>
            <button class="reset-btn" onclick="clearLogs()" title="대화 기록 초기화">
                <i class="bi bi-arrow-counterclockwise"></i> 대화 초기화
            </button>
        </div>
    </header>

    <div id="main-container">
        <!-- 👤 좌측: 캐릭터 프로필 카드 -->
        <aside class="char-sidebar">
            <div class="profile-avatar-wrap">
                <div class="profile-avatar" onclick="generateProfileImage()" title="클릭하여 프로필 이미지 생성/변경">
                    <img id="char-avatar" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="캐릭터 아바타">
                    <div class="profile-avatar-overlay" id="avatar-loading">
                        <i class="bi bi-camera"></i>&nbsp;그리는 중...
                    </div>
                </div>
                <div class="char-name" id="char-name">불러오는 중...</div>
                <div class="char-status">
                    <span class="status-dot"></span> 1:1 대화 가능
                </div>
                <div class="char-actions">
                    <button class="action-chip" onclick="generateProfileImage()">
                        <i class="bi bi-magic"></i> 프로필 일러스트
                    </button>
                    <button class="action-chip" id="edit-link-btn">
                        <i class="bi bi-pencil"></i> 설정 수정
                    </button>
                </div>
            </div>

            <div class="profile-card-section">
                <div class="info-box">
                    <div class="info-box-title" style="color: var(--brand);">
                        <i class="bi bi-stars"></i> 성격 & 말투 (봇 설정)
                    </div>
                    <div class="info-box-content" id="char-personality">-</div>
                </div>

                <div class="info-box">
                    <div class="info-box-title" style="color: var(--accent-blue-gray);">
                        <i class="bi bi-compass"></i> 관계 & 상황 배경
                    </div>
                    <div class="info-box-content" id="char-relation">-</div>
                </div>

                <div class="info-box">
                    <div class="info-box-title" style="color: #9333EA;">
                        <i class="bi bi-person-lines-fill"></i> 외형 묘사
                    </div>
                    <div class="info-box-content" id="char-appearance" style="font-size: 0.84rem; color: var(--text-secondary);">-</div>
                </div>

                <div class="info-box">
                    <div class="info-box-title" style="color: #00B58B;">
                        <i class="bi bi-chat-quote"></i> 최근 대화 기억
                    </div>
                    <div class="info-box-content" id="char-memories" style="font-size: 0.82rem; color: var(--text-secondary); max-height: 120px; overflow-y: auto;">
                        <span style="opacity: 0.6;">대화가 진행되면 핵심 기억이 요약됩니다.</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 💬 우측: 1:1 채팅창 -->
        <main class="chat-container">
            <div class="chat-header">
                <span id="chat-header-title">💬 대화방</span>
                <span style="font-size: 0.85rem; font-weight: normal; color: var(--text-secondary);" id="header-art-style"></span>
            </div>

            <div id="chat-window"></div>

            <div class="chat-input-bar">
                <input type="text" id="user-input" placeholder="메시지를 입력하세요..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button class="btn-scene" onclick="generateSceneImage()" title="현재 대화 장면을 일러스트로 생성">
                    <i class="bi bi-image"></i> 장면 생성
                </button>
                <button class="btn-send" id="send-btn" onclick="sendMessage()">
                    <span>전송</span> <i class="bi bi-send-fill"></i>
                </button>
            </div>
        </main>
    </div>

    <script>
        const scenarioId = window.location.pathname.split('/').pop();
        let characterData = null;
        let characterName = "AI 캐릭터";
        let characterAvatarUrl = "https://cdn-icons-png.flaticon.com/512/847/847969.png";

        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');

        window.onload = async () => {
            if (!scenarioId || scenarioId === 'chat') {
                alert("유효한 챗봇 ID가 아닙니다.");
                location.href = '/';
                return;
            }

            document.getElementById('edit-link-btn').onclick = () => {
                location.href = `/edit/${scenarioId}`;
            };

            await loadCharacterInfo();
            await loadHistory();
        };

        // 1. 캐릭터 정보 로드
        async function loadCharacterInfo() {
            try {
                const response = await fetch(`/api/scenario/${scenarioId}`);
                if (!response.ok) throw new Error("캐릭터 정보를 불러올 수 없습니다.");
                
                characterData = await response.json();
                characterName = characterData.title || "AI 캐릭터";
                document.title = `${characterName} - 인물 챗봇`;

                document.getElementById('char-name').innerText = characterName;
                document.getElementById('chat-header-title').innerHTML = `<i class="bi bi-chat-heart-fill" style="color: #FF5A79;"></i> ${characterName}과의 1:1 대화`;
                userInput.placeholder = `${characterName}에게 메시지 보내기...`;

                document.getElementById('char-personality').innerText = characterData.characterInfo || "설정 없음";
                document.getElementById('char-relation').innerText = characterData.worldSetting || "설정 없음";
                document.getElementById('char-appearance').innerText = characterData.appearance || "외형 묘사 없음";

                if (characterData.artStyle) {
                    document.getElementById('header-art-style').innerText = `화풍: ${characterData.artStyle.split(',')[0]}`;
                }

                if (characterData.playerImageUrl) {
                    characterAvatarUrl = characterData.playerImageUrl;
                    document.getElementById('char-avatar').src = characterAvatarUrl;
                }

                renderMemories(characterData.questLines || []);

            } catch (err) {
                console.error("캐릭터 정보 로드 실패:", err);
                alert("캐릭터 정보를 불러오지 못했습니다.");
            }
        }

        function renderMemories(memories) {
            const memEl = document.getElementById('char-memories');
            if (!memEl) return;
            if (memories && memories.length > 0) {
                memEl.innerHTML = memories.map(m => `<div style="margin-bottom: 6px; padding: 4px 6px; border-radius: 4px; background: var(--surface-2); border-left: 3px solid #00B58B;">💭 ${m}</div>`).join('');
            } else {
                memEl.innerHTML = '<span style="opacity: 0.6;">대화가 진행되면 핵심 기억이 요약됩니다.</span>';
            }
        }

        // 2. 메시지 화면 표시 함수
        function appendMessage(sender, text, isImage = false) {
            if (typeof text === 'string' && text.startsWith('[시스템]')) return;

            const isBot = (sender !== '나');
            const row = document.createElement('div');
            row.className = `msg-row ${isBot ? 'bot' : 'user'}`;

            const avatarHtml = isBot 
                ? `<div class="msg-avatar"><img src="${characterAvatarUrl}" alt="${characterName}"></div>`
                : '';

            let bubbleContent = '';
            if (isImage || (typeof text === 'string' && text.startsWith('http'))) {
                const imgSrc = text.includes('<img') ? text.match(/src=["']([^"']+)["']/)[1] : text;
                bubbleContent = `<img src="${imgSrc}" onclick="window.open(this.src)" style="cursor:pointer;" title="클릭하여 원본 보기">`;
            } else {
                bubbleContent = escapeHtml(text).replace(/\n/g, '<br>');
            }

            row.innerHTML = `
                ${avatarHtml}
                <div class="msg-content-wrap">
                    <span class="msg-sender">${isBot ? characterName : '나'}</span>
                    <div class="msg-bubble">${bubbleContent}</div>
                </div>
            `;

            chatWindow.appendChild(row);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        // 3. 대화 내역 불러오기
        async function loadHistory() {
            try {
                const response = await fetch(`/api/chat/${scenarioId}`);
                if (!response.ok) throw new Error('대화 기록을 가져올 수 없습니다.');
                
                const history = await response.json();
                chatWindow.innerHTML = '';

                if (history && history.length > 0) {
                    history.forEach(msg => {
                        const isUser = (msg.role === 'user' || msg.role === 'player');
                        const sender = isUser ? '나' : characterName;
                        const content = msg.content || '';
                        const isImg = content.startsWith('http') || content.startsWith('data:image');
                        appendMessage(sender, content, isImg);
                    });
                } else {
                    // 최초 접속 시 AI가 캐릭터 설정에 맞춰 첫인사를 건네도록 자동 트리거
                    sendMessage(`(대화를 시작합니다. '${characterName}' 캐릭터 설정에 맞춰 첫인사와 행동을 자연스럽게 건네주세요.)`, true);
                }
            } catch (err) {
                console.error("대화 내역 로드 에러:", err);
            }
        }

        // 4. 메시지 전송
        async function sendMessage(customText = null, isSilent = false) {
            const text = customText !== null ? customText : userInput.value.trim();
            if (!text) return;

            if (!isSilent) {
                appendMessage('나', text);
                userInput.value = '';
            }

            showTypingLoading();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        scenarioId,
                        userMessage: text,
                        model: document.getElementById('model-select').value
                    })
                });

                hideTypingLoading();

                if (response.ok) {
                    const data = await response.json();
                    appendMessage(characterName, data.reply);
                    if (data.questLines) {
                        renderMemories(data.questLines);
                    }
                } else {
                    appendMessage(characterName, "...(잠시 말을 잇지 못하고 생각에 잠긴 듯합니다.)");
                }
            } catch (err) {
                hideTypingLoading();
                console.error("전송 에러:", err);
                appendMessage(characterName, "...(연결이 원활하지 않습니다.)");
            }
        }

        function showTypingLoading() {
            hideTypingLoading();
            const row = document.createElement('div');
            row.id = 'bot-typing-indicator';
            row.className = 'msg-row bot';
            row.innerHTML = `
                <div class="msg-avatar"><img src="${characterAvatarUrl}" alt="${characterName}"></div>
                <div class="msg-content-wrap">
                    <span class="msg-sender">${characterName}</span>
                    <div class="loading-bubble">
                        <span>${characterName}이(가) 답변을 작성하는 중</span>
                        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                    </div>
                </div>
            `;
            chatWindow.appendChild(row);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function hideTypingLoading() {
            const el = document.getElementById('bot-typing-indicator');
            if (el) el.remove();
        }

        // 5. 프로필 이미지 생성
        async function generateProfileImage() {
            if (!confirm(`'${characterName}'의 캐릭터 프로필 일러스트를 AI로 새로 그릴까요?`)) return;

            const overlay = document.getElementById('avatar-loading');
            overlay.style.display = 'flex';

            try {
                const response = await fetch('/api/generate-player-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scenarioId })
                });

                if (response.ok) {
                    const data = await response.json();
                    characterAvatarUrl = data.playerImageUrl;
                    document.getElementById('char-avatar').src = characterAvatarUrl;
                    alert("✨ 새 프로필 일러스트가 저장되었습니다!");
                } else {
                    alert("초상화 생성 실패");
                }
            } catch (err) {
                console.error(err);
                alert("이미지 생성 통신 에러");
            } finally {
                overlay.style.display = 'none';
            }
        }

        // 6. 대화 장면 삽화 생성
        async function generateSceneImage() {
            if (!confirm(`'${characterName}'과의 현재 대화 장면 일러스트를 그릴까요?`)) return;

            showTypingLoading();
            try {
                const response = await fetch('/api/generate-image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scenarioId })
                });

                hideTypingLoading();

                if (response.ok) {
                    const data = await response.json();
                    const imgUrl = data.imageUrl || data.url;
                    appendMessage(characterName, imgUrl, true);

                    await fetch('/api/chat/save-image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            scenarioId,
                            role: 'assistant',
                            content: imgUrl
                        })
                    });
                } else {
                    const errJson = await response.json().catch(() => null);
                    const errMsg = (errJson && (errJson.error || (errJson.detail && errJson.detail.message))) || "장면 삽화 생성에 실패했습니다.";
                    alert("삽화 생성 안내: " + errMsg);
                }
            } catch (err) {
                hideTypingLoading();
                console.error(err);
                alert("삽화 생성 통신 에러: " + (err.message || "연결 실패"));
            }
        }

        // 7. 대화 초기화
        async function clearLogs() {
            if (!confirm("모든 대화 기록과 최근 기억을 지우고 처음부터 다시 대화를 시작할까요?")) return;
            try {
                const response = await fetch(`/api/chat/${scenarioId}`, { method: 'DELETE' });
                if (response.ok) {
                    alert("대화가 초기화되었습니다.");
                    location.reload();
                }
            } catch (err) {
                console.error("초기화 에러:", err);
            }
        }
    </script>
</body>
</html>
