<!DOCTYPE html>
<html lang="ko">
<head>
    <script>
    const url = window.location.href;
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gemini TRPG - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
        (function () {
            var b = location.protocol === 'file:' ? 'public/' : '/';
            document.write('<script src="' + b + 'js/theme.js"><\/script>' +
                '<link rel="stylesheet" href="' + b + 'css/theme.css">' +
                '<link rel="stylesheet" href="' + b + 'css/sidebar.css">' +
                '<script src="' + b + 'js/sidebar.js"><\/script>');
        })();
    </script>
    <style>
        /* 🎨 TRPG 다크 판타지 테마 색상 적용 */

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-dark-brown);
            color: var(--text-primary);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* 네비게이션 바 (베이지색 패널) */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            box-sizing: border-box;
            padding: 0 32px;
            background-color: var(--bg-beige);
            border-bottom: 1px solid var(--border);
            color: var(--text-black);
        }

        .logo { font-size: 1.5rem; font-weight: bold; color: var(--accent-blue-gray); cursor: pointer; }
        .nav-left { display: flex; align-items: center; gap: 8px; }
        .nav-left .logo { display: none; }
        @media (max-width: 768px) {
            nav { padding: 0 16px; }
            main { padding: 1.5rem 16px; }
            .nav-left .logo { display: block; font-size: 1.25rem; }
            .hero-section h1 { font-size: 1.8rem; }
        }
        .user-menu { display: flex; align-items: center; gap: 15px; font-weight: bold; color: var(--text-primary); }

        /* 메인 컨텐츠 */
        main {
            flex: 1;
            padding: 2rem 32px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .hero-section {
            margin-bottom: 3rem;
            text-align: left;
        }

        .hero-section h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--text-primary); }
        .hero-section p { color: var(--text-secondary); }

        /* 시나리오 카드 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* 시나리오 카드 (양피지 느낌) */
        .card {
            position: relative;
            background-color: var(--bg-beige);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 3px rgba(26,25,24,0.06);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            cursor: pointer;
            color: var(--text-black);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(26,25,24,0.10);
            border-color: var(--accent-blue-gray);
        }

        .card h3 { 
            margin: 0 0 10px 0; 
            color: var(--text-black); 
            border-bottom: 1px solid var(--border); 
            padding-bottom: 8px;
            padding-right: 80px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card p { font-size: 0.95rem; color: var(--text-gray); height: 40px; overflow: hidden; line-height: 1.4;}
        
        .card-footer {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--accent-blue-gray);
            font-weight: bold;
        }

        /* 삭제 버튼 (카드 내) */
        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            background-color: var(--brand-soft);
            color: var(--brand);
            border: 1px solid var(--brand);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: 0.2s;
        }

        .delete-btn:hover {
            background-color: var(--brand);
            color: white;
            transform: scale(1.1);
        }

        /* 수정 버튼 (카드 내) */
        .edit-btn {
            position: absolute;
            top: 15px;
            right: 55px; /* 삭제 버튼 왼쪽에 배치 */
            width: 32px;
            height: 32px;
            background-color: var(--surface-2);
            color: var(--text-secondary);
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: 0.2s;
        }

        .edit-btn:hover {
            background-color: var(--text-primary);
            color: var(--surface);
            transform: scale(1.1);
        }

        /* 버튼 스타일 (청회색 포인트) */
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            font-size: 1rem;
        }

        .btn-primary { background-color: var(--brand); color: white; border: 1px solid var(--brand); }
        .btn-outline { background-color: var(--surface); border: 1px solid var(--border-strong); color: var(--text-primary); }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        #scenario-list-empty {
            text-align: center;
            padding: 50px;
            color: var(--text-tertiary);
            grid-column: 1 / -1;
            background: var(--surface);
            border-radius: 12px;
            border: 1px dashed var(--border-strong);
        }
    </style>
</head>
<body class="has-sidebar">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a class="sidebar-logo" href="/"><i class="bi bi-dice-5-fill"></i><span>Gemini TRPG</span></a>
            <button class="icon-btn" onclick="toggleSidebar()" title="사이드바 접기/펼치기" aria-label="사이드바 접기/펼치기">
                <i class="bi bi-layout-sidebar"></i>
            </button>
        </div>

        <div class="sidebar-menu">
            <a class="sidebar-item active" href="/" title="홈"><i class="bi bi-house"></i><span class="sidebar-label">홈</span></a>
            <a class="sidebar-item" href="/create" title="새 시나리오"><i class="bi bi-plus-circle"></i><span class="sidebar-label">새 시나리오</span></a>
            <a class="sidebar-item" href="#scenario-grid" title="내 시나리오"><i class="bi bi-collection"></i><span class="sidebar-label">내 시나리오</span></a>
        </div>

        <div class="sidebar-section-title">추가 영역</div>
        <div class="sidebar-content">
            <p style="padding: 0 12px; margin: 4px 0; color: var(--text-tertiary);">여기에 원하는 내용을 채우세요.</p>
        </div>

        <div class="sidebar-account">
            <div class="account-full">
                <div id="account-guest">
                    <p class="account-guest-text">지금 로그인하고<br>모든 기능을 자유롭게 이용하세요</p>
                    <button class="account-login-btn" onclick="location.href='/auth/google'"><i class="bi bi-google"></i> Google로 시작하기</button>
                </div>
                <div id="account-member" class="account-user" hidden>
                    <div class="account-avatar" id="account-avatar">?</div>
                    <div class="account-name" id="account-name"></div>
                    <button class="icon-btn" onclick="location.href='/auth/logout'" title="로그아웃" aria-label="로그아웃"><i class="bi bi-box-arrow-right"></i></button>
                </div>
                <div class="account-divider"></div>
                <label class="theme-row">
                    <span><i data-theme-icon class="bi bi-moon-stars"></i> 다크 모드</span>
                    <span class="switch"><input type="checkbox" data-theme-switch aria-label="다크 모드"><span class="track"></span></span>
                </label>
            </div>
            <div class="account-rail">
                <button class="icon-btn" data-account-action onclick="location.href='/auth/google'" title="로그인"><i class="bi bi-person-circle"></i></button>
                <button class="icon-btn" onclick="toggleTheme()" title="다크 모드 전환"><i data-theme-icon class="bi bi-moon-stars"></i></button>
            </div>
        </div>
    </aside>
    <div class="sidebar-backdrop" onclick="closeSidebar()"></div>

    <nav>
        <div class="nav-left">
            <button class="icon-btn sidebar-open-btn" onclick="openSidebar()" title="메뉴 열기" aria-label="메뉴 열기"><i class="bi bi-list"></i></button>
            <div class="logo" onclick="location.href='/'">Gemini TRPG</div>
        </div>
        <div class="user-menu" id="auth-menu">
            <span id="user-name">불러오는 중...</span>
            <button class="btn btn-outline" id="auth-btn" style="padding: 8px 15px; font-size: 0.9rem;">연결 중...</button>
        </div>
    </nav>

    <main>
        <section class="hero-section">
            <h1>당신의 모험을 시작하세요</h1>
            <p>AI 마스터와 함께 당신만의 시나리오를 완성하세요.</p>
            <button class="btn btn-primary" style="margin-top: 20px;" onclick="createNewScenario()">
                <i class="bi bi-plus-lg"></i> 새 시나리오 생성
            </button>
        </section>

        <h2 style="color: var(--text-primary); border-bottom: 2px solid var(--brand); padding-bottom: 10px; display: inline-block;">내 시나리오 목록</h2>
        <div class="grid" id="scenario-grid" style="margin-top: 20px;">
            <div id="scenario-list-empty">로그인하여 시나리오를 확인하세요.</div>
        </div>
    </main>

    <script>
        // 팝업창용 변수(currentScenarios)는 이제 안 쓰니까 지웠습니다!

        // 페이지 로드 시 사용자 상태 확인
        window.onload = async () => {
            try {
                const response = await fetch('/api/user');
                const user = await response.json();
                
                const userNameElem = document.getElementById('user-name');
                const authBtn = document.getElementById('auth-btn');

                if (user && user.username) {
                    // 1. 로그인 성공 상태
                    userNameElem.innerText = `${user.username} 님`;
                    authBtn.innerText = "로그아웃";
                    authBtn.className = "btn btn-outline";
                    authBtn.onclick = () => location.href = '/auth/logout';
                    
                    // 로그인 후 시나리오 목록 불러오기
                    loadMyScenarios();
                } else {
                    // 2. 게스트 상태
                    userNameElem.innerText = "게스트 님";
                    authBtn.innerText = "Google 로그인";
                    authBtn.className = "btn btn-primary";
                    authBtn.onclick = () => location.href = '/auth/google';
                }
            } catch (err) {
                console.error("인증 정보를 가져오는데 실패했습니다.", err);
            }
        };

        // 내 시나리오 목록 가져오기
        async function loadMyScenarios() {
            const grid = document.getElementById('scenario-grid');
            try {
                const response = await fetch('/api/my-scenarios');
                const scenarios = await response.json();

                if (scenarios.length > 0) {
                    grid.innerHTML = ''; 
                    scenarios.forEach(s => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        card.onclick = () => location.href = `/game/${s._id}`;
                        
                        // 🔥 여기서 수정 버튼을 누르면 '/edit/아이디' 로 이동하도록 바꿨습니다!
                        card.innerHTML = `
                            <div class="delete-btn" onclick="deleteScenario(event, '${s._id}')" title="삭제">
                                <i class="bi bi-trash"></i>
                            </div>
                            <div class="edit-btn" onclick="event.stopPropagation(); location.href='/edit/${s._id}';" title="수정">
                                <i class="bi bi-pencil"></i>
                            </div>
                            <h3>${s.title}</h3>
                            <p>${s.worldSetting || '설명이 없습니다.'}</p>
                            <div class="card-footer">
                                <span><i class="bi bi-calendar3"></i> ${new Date(s.createdAt).toLocaleDateString()}</span>
                                <span>입장하기 <i class="bi bi-arrow-right"></i></span>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<div id="scenario-list-empty">아직 만든 시나리오가 없습니다. <br><br>위의 [새 시나리오 생성] 버튼을 눌러 모험을 시작하세요!</div>';
                }
            } catch (err) {
                grid.innerHTML = '<div id="scenario-list-empty">시나리오를 불러오지 못했습니다.</div>';
            }
        }

        // 새 시나리오 생성 함수 
        function createNewScenario() {
            const authBtn = document.getElementById('auth-btn');
            
            if (authBtn.innerText === "Google 로그인") {
                alert("로그인이 필요한 서비스입니다.");
                return;
            }
            location.href = '/create'; 
        }

        // 삭제 함수
        async function deleteScenario(event, id) {
            event.stopPropagation();

            if (!confirm("정말로 이 시나리오를 삭제하시겠습니까?\n관련 대화 기록이 모두 사라집니다.")) return;

            try {
                const response = await fetch(`/api/scenarios/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadMyScenarios(); // 목록 새로고침
                } else {
                    const errMsg = await response.text();
                    alert("삭제 실패: " + errMsg);
                }
            } catch (err) {
                console.error("삭제 중 오류 발생:", err);
                alert("서버 통신 오류가 발생했습니다.");
            }
        }
    </script>
</body>
</html>
